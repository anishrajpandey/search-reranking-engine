version: '3.8'

services:
  # 1. Ultra-fast In-Memory Cache Layer
  redis:
    image: redis:7-alpine
    container_name: rerank-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Cluster Coordinator for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rerank-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms128m -Xmx256m"

  # 3. Distributed Event Streaming Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rerank-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"